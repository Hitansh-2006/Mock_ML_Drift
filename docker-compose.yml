# Brings up Postgres, the serving API (which hosts the automation loop - start it
# from the dashboard) and the dashboard. Run with:
#     docker compose up --build
#
# NOTE: this file has been written carefully but NOT run in a live Docker
# environment as part of building it (Claude's build sandbox doesn't have
# Docker available). Test it yourself with `docker compose up --build`
# and tell me what breaks, if anything — the Postgres connection, the
# retrain/serving code, and the dashboard's API calls have all been
# tested directly, just not through Compose itself.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: driftwatchdog
      POSTGRES_USER: driftwatchdog
      POSTGRES_PASSWORD: driftwatchdog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatchdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  serving:
    build:
      context: .
      dockerfile: Dockerfile
    # ONE worker on purpose: the model cache and the automation scheduler live in the process.
    command: uvicorn serving.app:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      DRIFT_WATCHDOG_DB_URL: postgresql://driftwatchdog:driftwatchdog@postgres:5432/driftwatchdog
      # First dashboard account. Compose refuses to start without a password (see .env.example).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env - see .env.example}
      GUEST_LOGIN_ENABLED: "${GUEST_LOGIN_ENABLED:-1}"
      # Optional machine key, only needed for the headless profile below.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Used by the in-process automation loop (the dashboard's Automation card):
      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-60}"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Headless fallback only. The default stack runs the automation loop INSIDE the
  # serving process, switched on/off from the dashboard's Automation card, so a
  # plain `docker compose up` must not start a second loop next to it. To use the
  # separate loop instead:  docker compose --profile headless up --build
  automation:
    profiles: ["headless"]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m automation.loop
    environment:
      DRIFT_WATCHDOG_DB_URL: postgresql://driftwatchdog:driftwatchdog@postgres:5432/driftwatchdog
      SERVING_API_URL: http://serving:8000
      CHECK_INTERVAL_SECONDS: "60"
      # The headless loop has no login: it needs the same ADMIN_API_KEY as `serving` (set it in .env).
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      serving:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - serving

volumes:
  pgdata:
