name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Docker image runs; 3.12 is what development used.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  dashboard:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches dashboard/Dockerfile
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Python image
        run: docker build -t drift-watchdog-api .
      - name: The image must not contain secrets, databases or git history
        run: |
          docker run --rm --entrypoint sh drift-watchdog-api -c '
            test ! -e .env && test ! -e .git && test -z "$(find . -name "*.db" -print -quit)" \
              && test -e models/model_v1.joblib && test -e serving/app.py'
      - name: Build the dashboard image
        run: docker build -t drift-watchdog-dashboard dashboard
